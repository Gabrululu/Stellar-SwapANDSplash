[package]
name = "swap_pool"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
splash_token = { path = "../splash_token" }

[features]
testutils = ["soroban-sdk/testutils"]
